# Single policy: rear-extended belly-down get-up and standing, without pushes.
control:
  decimation: 10
  leg_action_scale_rad: 0.25
  leg_joints:
  - left_link1_joint
  - left_link_rear_1_joint
  - right_link1_joint
  - right_rear_link1_joint
  leg_kd: 1.0
  leg_kp: 20.0
  leg_speed_limit_rad_s: 15.0
  leg_torque_limit_Nm: 10.0
  wheel_action_scale_rad_s: 10.0
  wheel_action_sign: [1.0, -1.0]
  wheel_joints:
  - left_link 3_joint
  - right_link 3_joint
  wheel_kv: 0.2
  wheel_speed_limit_rad_s: 30.0
  wheel_torque_limit_Nm: 2.0
experiment:
  approximation_notes:
  - Actual repaired CAD geometry and six closures retained. Latest five masses used;
    no total/side normalization.
  - Inherited COM/inertia and other masses accepted as current simulation parameters,
    not bench identified.
  - 450 N nominal spring modeled as constant extension force; force curve and damping
    unknown; pin-center travel constrained to user-confirmed 155-220 mm.
  - Controller gains, damping, armature, friction and output limits are simulation
    settings.
  - Standing reference is the physical motor-axis midpoint to wheel-center side-view
    distance of 135 mm, with chassis mounting plate horizontal.
  backend: mujoco
  model_route: cad_dynamics
  output_directory: outputs/cad_getup_stand
  simulation_only: true
  source_model: outputs/cad_repaired/robot_cad_repaired.xml
mass:
  method: preserve_repaired_body_inertials_no_scaling
physics:
  active_armature: 0.002
  base_collision_half_extents_m:
  - 0.12
  - 0.09
  - 0.035
  chassis_reference_mesh: part_151_solid_151
  ik_max_closure_error_m: 0.0001
  ik_max_height_error_m: 0.003
  ik_seed: 42
  joint_damping: 0.05
  # CAD source marks these hinges continuous; +/-1.57 was an export branch guard.
  # Opt-in simulation ranges for rear extension, not measured hardware stops.
  joint_range_overrides_rad:
    left_link_rear_1_joint: [-3.2, 1.57]
    right_rear_link1_joint: [-3.2, 1.57]
    left_link2_joint: [-2.5, 2.5]
    left_link_rear3_joint: [-2.5, 2.5]
    left_link_rear4_joint: [-2.5, 2.5]
    left_link_reear2_joint: [-2.5, 2.5]
    right_link2_joint: [-2.5, 2.5]
    right_rear_link3_joint: [-2.5, 2.5]
    right_rear_link 4_joint: [-2.5, 2.5]
    right_rear_link2_joint: [-2.5, 2.5]
  motor_center_reference_meshes:
    left:
    - part_439_surface_shell_439
    - part_449_surface_shell_449
    right:
    - part_270_surface_shell_270
    - part_280_surface_shell_280
  passive_armature: 0.0001
  reset_clearance_m: 0.002
  rest_motor_midpoint_to_wheel_center_m: 0.135
  solver_iterations: 100
  standing_distance_definition: motor_midpoint_to_wheel_center_side_view
  timestep: 0.001
  wheel_center_reference_meshes:
    left: part_515_solid_515
    right: part_346_solid_346
  wheel_friction: 0.8
  wheel_radius_m: 0.056
reward:
  action_rate: 0.02
  alive: 0.5
  angular_velocity: 0.1
  fall_penalty: 20.0
  heading_hold: 1.5
  joint_speed: 0.0001
  linear_tracking: 2.0
  normalized_effort: 0.01
  position_hold: 2.0
  upright: 6.0
  virtual_leg_length: 2.0
  yaw_tracking: 1.5
spring:
  # User confirmed pin centers: 155 mm compressed, 220 mm extended.
  eye_center_limits_m:
    left: [0.155, 0.220]
    right: [0.155, 0.220]
  force_N: 450.0
  model: constant_extension_force_at_reconstructed_pin_sites
  physical_curve_verified: false
task:
  command_forward_m_s:
  - 0.0
  - 0.0
  command_yaw_rad_s:
  - 0.0
  - 0.0
  episode_seconds: 20.0
  heading_sigma_rad: 0.08726646259971647
  linear_tracking_sigma_m_s: 0.05
  position_sigma_m: 0.05
  reset_tilt_std_rad: 0.008
  reset_velocity_std: 0.005
  stationary_hold: true
  stationary_max_displacement_m: 0.05
  stationary_max_heading_rad: 0.08726646259971647
  terminate_base_height_m: 0.075
  terminate_max_closure_error_m: 0.01
  terminate_tilt_rad: 0.8
  upright_sigma_rad: 0.17453292519943295
  virtual_leg_length_sigma_m: 0.01
  yaw_tracking_sigma_rad_s: 0.05
training:
  allow_getup_guard_warm_start: true
  action_std: 0.15
  actor_hidden_dims:
  - 128
  - 64
  - 32
  batch_size: 512
  checkpoint_steps: 10000
  clip_range: 0.1
  critic_hidden_dims:
  - 256
  - 128
  - 64
  ent_coef: 0.0
  gae_lambda: 0.97
  gamma: 0.999
  learning_rate: 3.0e-05
  max_grad_norm: 1.0
  n_epochs: 10
  n_steps: 1024
  num_envs: 8
  seed: 61
  total_timesteps: 2000000
push:
  enabled: false
  episode_probability: 0.0
  force_N:
  - 2.0
  - 5.0
  duration_seconds:
  - 0.05
  - 0.1
  interval_seconds:
  - 8.0
  - 12.0
  first_push_seconds: 3.0
  recovery_seconds: 4.0
  settle_seconds: 0.5
  max_transient_displacement_m: 0.2
  max_transient_heading_rad: 0.3490658503988659
  recovery_tilt_rad: 0.08726646259971647
getup:
  enabled: true
  reference_mode: closed_chain_waypoints
  stand_probability: 0.5
  reset_pose: rear_extended_belly_down
  # Wheel center behind the physical motor midpoint in the existing chassis frame.
  # Simulation examples selected for a nearly horizontal rear extension, not measured lengths.
  rearward_offsets_m: [0.36, 0.37, 0.375]
  ground_clearance_m: 0.0005
  rise_seconds: 4.0
  deadline_seconds: 10.0
  settle_seconds: 1.0
  leg_tolerance_m: 0.01
  height_tolerance_m: 0.015
  tilt_tolerance_rad: 0.08726646259971647
  success_bonus: 50.0
  height_reward: 3.0
  max_displacement_m: 0.2
  dense_progress_reward: 6.0
  unfinished_penalty: 0.1
