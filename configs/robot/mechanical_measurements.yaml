# Confirmed masses are applied to the repaired kinematic MJCF; COM/inertia remain uncalibrated.
# SI conversions preserve source scope/ambiguities. No curve fitting performed.
source:
  document: /home/lsx/下载/机械数据.docx
  review: docs/机械数据核对.md
  precedence: latest_user_confirmation_then_latest_mechanical_data_then_firmware_reference
  firmware_conflicts_are_reference_only: true

mass:
  latest_body_mass_update_2026_10_28:
    source: user_confirmation_2026_10_28
    source_statement: 'bas主体刚体是12.7kg，左右轮部刚体是540g，左右link2是890g'
    body_name_normalization: {bas: base}
    bilateral_values_are_each_body: true
    body_masses_kg:
      base: 12.7
      'left_link 3': 0.54
      'right_link 3': 0.54
      left_link2: 0.89
      right_link2: 0.89
    confirmed_body_count: 5
    confirmed_body_mass_subtotal_kg: 15.56 # only these five distinct bodies
    status: authoritative_user_confirmed
    replaces_previous_mass_values: true
    full_model_total_mass_kg: null # no revised whole-model total supplied
    precedence: latest_body_masses_override_older_values_for_these_same_bodies
    com_and_inertia_supplied: false
    applied_to_mjcf: true # repaired kinematic candidate mass only; source CAD exports are not rewritten
    inertia_update_policy: retain_existing_uncalibrated_values_without_scaling
    identification_table: configs/robot/measurements/rigid_bodies.csv
  total_mass_for_simulation_kg: null # derive from all body masses once supplied; no old total constraint
  side_total_kg: null # no aggregate side mass constraint
  chain_removed_from_export: true
  chain_mass_each_side_kg: null
  per_link_mass_distribution_verified: false # individual link inertials still unverified

geometry:
  nominal_wheel_radius_m: 0.056 # earlier user message
  loaded_effective_wheel_radius_m: 0.055 # document final summary
  half_track_m: 0.21080 # document final summary; earlier text 0.210805
  track_m: 0.4216
  body_com_offset_magnitude_m: 0.04213
  body_com_offset_vector_m: null # scalar is insufficient for 3D COM and sign
  virtual_leg_length_definition: midpoint_of_front_rear_hip_axes_to_wheel_center
  nominal_standing_pose:
    source: user_clarification_2026_10_28_motor_midpoint
    source_statement: '两个电机轴心连线的中点到轮毂中心为 0.135 米'
    pose_role: normal_standing # confirmed by user; not a joint-angle calibration
    motor_axis_midpoint_to_wheel_center_distance_m: 0.135
    distance_projection: side_view_ignore_lateral_installation_offset # explicit user confirmation
    motor_center_reference_meshes:
      left: [part_439_surface_shell_439, part_449_surface_shell_449]
      right: [part_270_surface_shell_270, part_280_surface_shell_280]
    motor_center_reference_basis: concentric_cad_motor_housing_side_view_circle_fit
    driven_joint_origins_are_not_physical_motor_centers: true
    hip_to_wheel_vertical_separation_m: null # previous 135 mm vertical interpretation withdrawn
    dimension_interpretation: midpoint_of_two_physical_motor_axes_to_wheel_hub_center
    dimension_interpretation_basis: explicit_user_confirmation_2026_10_28
    hip_to_wheel_horizontal_offset_m: null # sketch is not a scaled CAD measurement
    hip_axis_height_above_ground_estimate_m: null # 135 mm is a distance, not a vertical height
    base_origin_height_above_ground_m: null # base-to-hip transform still required
    body_ground_clearance_m: null # underside-to-ground distance is not marked
    active_joint_positions_rad: null # height alone does not determine all four joint angles

inertia:
  wheel_assembly_axial_kg_m2: 0.0007865 # 0.5 * 0.52 kg * (0.055 m)^2; formula estimate in DOCX, not independently measured
  wheel_axial_inertia_method: solid_cylinder_half_mass_radius_squared
  wheel_inertia_axis_and_rotating_parts_verified: false # assembly mass includes gearbox/housing
  central_body_pitch_at_com_kg_m2: 0.17607975764 # 176079757.64 g mm^2 * 1e-9
  central_body_pitch_summary_kg_m2: 0.1761
  whole_robot_yaw_summary_kg_m2: 0.2818
  whole_robot_yaw_alternate_kg_m2: 0.45236925759 # earlier document value, pose unspecified
  whole_robot_yaw_at_length_0_135m_candidate_kg_m2: 0.28175089999
  yaw_axis_description: vertical_through_midpoint_of_equivalent_hip_connections
  yaw_reference_pose_verified: false
  per_link_full_inertia_tensors_verified: false

equivalent_leg_samples:
  # Rows kept in original source order. L/lw are m; inertia converted from kg mm^2.
  # Source table's lb column was empty. It can be derived as L-lw.
  # Measurement instructions describe pitch inertia at COM; actual axis/scope not verified.
  columns: [leg_length_m, com_distance_from_wheel_m, pitch_inertia_kg_m2]
  samples:
    - [0.109, 0.10391, 0.02569425]
    - [0.135, 0.12533, 0.02751139]
    - [0.120, 0.11191, 0.02638158]
    - [0.140, 0.12268, 0.02791156]
    - [0.160, 0.13713, 0.02965849]
    - [0.180, 0.151208, 0.03161375]
    - [0.200, 0.166258, 0.03381403]
    - [0.220, 0.18034, 0.03619037]
    - [0.240, 0.19620, 0.03905857]
    - [0.260, 0.213154, 0.04180830]
    - [0.280, 0.223908, 0.04463235]
    - [0.300, 0.238875, 0.04794551]
    - [0.320, 0.240518, 0.05133024]
    - [0.340, 0.269230, 0.05540561]
    - [0.362, 0.312, 0.05971334]
  source_order_sorted: false
  measured_scope_verified: false
  scope_note: historical_DOCX_leg_excludes_wheel_and_joint_motors_not_automatically_current_5_14kg_side_assembly
  full_cad_pose_per_sample_available: false # L alone does not determine all closed-chain joint angles
  fit_coefficients: null
  valid_joint_limits_from_samples: null # measured virtual lengths are not mechanical limits
