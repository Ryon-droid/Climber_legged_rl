control:
  decimation: 10
  leg_action_scale_rad: 0.25
  leg_joints:
  - left_link1_joint
  - left_link_rear_1_joint
  - right_link1_joint
  - right_rear_link1_joint
  leg_kd: 2.0
  leg_kp: 80.0
  leg_speed_limit_rad_s: 15.0
  leg_torque_limit_Nm: 40.0
  wheel_action_scale_rad_s: 10.0
  wheel_action_sign:
  - 1.0
  - -1.0
  wheel_joints:
  - left_link 3_joint
  - right_link 3_joint
  wheel_kv: 0.5
  wheel_speed_limit_rad_s: 30.0
  wheel_torque_limit_Nm: 4.0
experiment:
  approximation_notes:
  - Actual repaired CAD geometry and six closures retained. Latest five masses used;
    no total/side normalization.
  - Inherited COM/inertia and other masses accepted as current simulation parameters,
    not bench identified.
  - Controller gains, damping, armature, friction and output limits are simulation
    settings.
  - Standing reference is the physical motor-axis midpoint to wheel-center side-view
    distance of 135 mm, with chassis mounting plate horizontal.
  - User-confirmed joint-output rated 20 Nm, peak 40 Nm; 0.6 s peak window is a simulation
    setting, not a measured thermal duty.
  - User confirmed maximum mounting-eye center distance 208 mm on 2026-11-06; the
    inherited 155 mm minimum and nominal 450 N extension force are retained.
  - Prone pose is recalculated under the 208 mm upper stop.
  - 'S4b-1 forward curriculum: standing resets only, continued strictly from the S2c
    get-up baseline with the same 36-input layout. Only forward/backward commands
    +/-0.12 m/s are enabled; yaw commands stay zero until the second sub-stage. Trainable
    action noise, higher learning rate and wider gradient clip target the observed
    zero-motion stagnation of S4a. Simulation targets only.'
  - 'S4d-1 wheel servo migration: the S4a/S4b/S4c attempts showed the 0.2 rad/s-per-Nm
    wheel servo could not overcome the 450 N spring closure load, so the commanded
    wheel speed produced no rotation. wheel_kv rises 0.2 to 0.5 and the wheel torque
    limit 2 to 4 Nm; leg gains, geometry, mass and spring stay unchanged. Standing
    resets only, same 36-input layout, forward/backward commands +/-0.12 m/s, yaw
    zero. Simulation targets only.'
  - 'S4d-2 idle balance pretraining: zero command ranges and idle-only sampling, trained
    from scratch without the S2c warm start so balancing is learned before velocity
    tracking. Same 24-input velocity observation layout, physics and reward as d1.'
  backend: mujoco
  model_route: cad_dynamics
  output_directory: outputs/cad_balance_spring208_phase3d1_idle
  simulation_only: true
  source_model: outputs/cad_repaired/robot_cad_repaired.xml
mass:
  method: preserve_repaired_body_inertials_no_scaling
