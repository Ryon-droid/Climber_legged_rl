    forward_rmse_m_s: 0.05
    idle_max_displacement_m: 0.05
    idle_max_heading_rad: 0.08726646259971647
    lateral_rmse_m_s: 0.05
    leg_rmse_m: 0.01
    max_tilt_rad: 0.17453292519943295
    settle_seconds: 2.0
    yaw_rmse_rad_s: 0.15
  velocity_observation_layout: getup_standing
  velocity_tracking: true
  virtual_leg_length_sigma_m: 0.01
  yaw_tracking_sigma_rad_s: 0.15
  yaw_action_per_rad_s: 0.8
  yaw_action_sigma: 0.30
  wheel_command_layout: v_yaw
training:
  action_std:
  - 0.03
  - 0.03
  - 0.03
  - 0.03
  - 0.3
  - 0.3
  actor_hidden_dims:
  - 128
  - 64
  - 32
  allow_velocity_standing_warm_start: true
  allow_wheel_control_warm_start: true
  batch_size: 256
  checkpoint_steps: 25000
  clip_range: 0.2
  critic_hidden_dims:
  - 256
  - 128
  - 64
  ent_coef: 0.005
  evaluate_initial_policy: true
  evaluation_steps: 25000
  freeze_action_std: false
  gae_lambda: 0.995
  gamma: 0.99
  learning_rate: 3.0e-04
  max_grad_norm: 5.0
  n_epochs: 3
  n_steps: 512
  num_envs: 4
  reset_optimizer_on_warm_start: true
  seed: 202644
  separate_actor_critic_gradient_clipping: true
  target_kl: 0.03
  total_timesteps: 1800000
  vf_coef: 0.5
  remap_wheel_channels_warm_start: true
push:
  enabled: false
getup:
  enabled: false
observations:
  history_frames: 1
robustness:
  # Per-episode domain randomization so sim→real gap is covered before first deployment.
  # Scales are physical-unit half-widths; the wrapper multiplies by built-in per-block scales.
  observation_noise:
    angular_velocity: 0.05
    gravity: 0.02
    joint_velocity: 0.1
    leg_position: 0.01
  # 50 Hz control → range [0, 2] covers 0-40 ms network/actuator latency.
  action_delay_steps:
  - 0
  - 2
  # Friction ranges to cover wet/dry asphalt, concrete, and slightly loose dirt.
  wheel_friction_multiplier:
  - 0.6
  - 1.4
  # Motor torque spread from manufacturing tolerance + LiPo voltage droop.
  motor_strength:
  - 0.85
  - 1.15
